# What a screen gets when it takes this plugin: the Situation dropdown select entity ("Allgemein" as default)
# and the baby_wetter component. All sensors (weather/outdoor, indoor) and birthdate are configured directly on the tile.
select:
  - platform: template
    id: baby_wetter_situation
    name: "Baby Wetter Situation"
    icon: mdi:baby-carriage
    optimistic: true
    options:
      - "Allgemein"
      - "Kinderwagen"
      - "Babytrage"
      - "Auto"
      - "Schlafen"
      - "Zuhause"
    initial_option: "Allgemein"
    restore_value: true
    entity_category: config

baby_wetter:
  situation: baby_wetter_situation
